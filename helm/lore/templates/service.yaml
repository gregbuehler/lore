apiVersion: v1
kind: Service
metadata:
  name: {{ include "lore.fullname" . }}
  labels:
    {{- include "lore.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "lore.selectorLabels" . | nindent 4 }}
